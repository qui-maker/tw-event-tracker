name: 晚班（台股收盤、評估、日報）
on:
  schedule:
    - cron: "33 6 * * 1-5"  # UTC 06:33 = 台北週一～週五 14:33（GitHub 實測延遲約 1 小時，實際約 15:30；資料未齊就先不產生日報）
    - cron: "13 7 * * *"    # UTC 07:13 = 台北時間 15:13（實測實際約 16:15～16:30 執行）
    - cron: "17 10 * * *"   # UTC 10:17 = 台北時間 18:17（補抓較晚公布的資料，不重複產生日報）
  workflow_dispatch:
    inputs:
      date:
        description: 補跑指定日期（YYYY-MM-DD，留空＝今天）
        default: ""
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"   # 即時輸出紀錄；被取消時也看得到跑到哪一步
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: 執行晚班
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -m jobs.evening --date "${{ inputs.date }}"; else python -m jobs.evening; fi
