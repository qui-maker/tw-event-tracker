name: 週報與資料備份
on:
  schedule:
    - cron: "23 12 * * 0"   # 每週日 UTC 12:23 = 台北時間 20:23
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write           # 要把備份檔寫回 repo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"   # 即時輸出紀錄；被取消時也看得到跑到哪一步
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - run: python -m jobs.periodic --kind weekly
      - name: 把備份存回 repo（同時讓 repo 保持活躍，避免排程在 60 天後被停用）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "每週資料備份 $(date -u +%F)"
          git push
