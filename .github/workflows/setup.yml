name: 建立資料表與回補歷史資料
on:
  workflow_dispatch:
    inputs:
      years:
        description: 回補幾年的歷史資料
        default: "3"
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"   # 即時輸出紀錄；被取消時也看得到跑到哪一步
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: 建立資料表
        run: python -m jobs.setup_db
      - name: 回補歷史資料
        run: python -m jobs.backfill --years ${{ inputs.years }}
